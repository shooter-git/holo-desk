name: HO[LO] Engine

# The downloads: one file for each computer. Built when a release is published (and attached to it),
# or by hand (Actions → HO[LO] Engine → Run workflow) to try them first.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux build anywhere with Zig; macOS on a Mac, where Apple's frameworks are
          - runner: ubuntu-24.04
            targets: win32-x64 linux-x64
          - runner: macos-14
            targets: darwin-arm64 darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Zig 0.16.0
        if: runner.os == 'Linux'
        run: |
          curl -sSfLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - name: Build
        run: pnpm engine:build --release ${{ matrix.targets }}
      - name: Zip the macOS and Linux ones (a zip keeps a program a program)
        working-directory: apps/companion/dist
        run: for f in holo-engine-macos-* holo-engine-linux-*; do [ -f "$f" ] && zip -9 "$f.zip" "$f"; done; true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holo-engine-${{ runner.os }}
          path: |
            apps/companion/dist/*.exe
            apps/companion/dist/*.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: apps/companion/dist
        run: gh release upload "$TAG" $(ls *.exe *.zip 2>/dev/null) --clobber
